@LOAD@
# ZERO-HOOK consumer scenario (the harness import-prompt's recommended
# start): @LOAD@ above load_modules the harness's REFERENCE probe module
# (ngx_http_test_ref_module.so) -- the compression module itself carries
# no probe hooks. @BUILD_OBJS@ resolves to the same build tree's objs/,
# so this line loads the module under test beside it. On a tree lacking
# either .so, ./requires has already SKIPped the scenario.
load_module @BUILD_OBJS@/ngx_http_compression_filter_module.so;
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    server {
        listen 127.0.0.1:@PORT@;

        # A REAL STATIC ROOT, not `return 200`: a return directive fires
        # at the REWRITE phase and short-circuits the body-filter chain
        # this module lives in -- the scenario would measure an
        # unfiltered synthetic response. The driver writes
        # @PREFIX@/www/index.html before booting.
        root @PREFIX@/www;

        location / {
            compression on;
            compression_min_length 0;
        }

        location /__probe { @PROBE@ }
    }
}
